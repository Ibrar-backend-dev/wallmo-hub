services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallmo
      POSTGRES_PASSWORD: wallmo
      POSTGRES_DB: wallmo
    ports:
      # 5432 on the host is often taken by a local Postgres install;
      # override with DB_PORT if 5433 is busy too.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallmo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wallmo:wallmo@db:5432/wallmo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
